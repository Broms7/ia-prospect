<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Audit digital personnalisé — Kaïro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,700;1,900&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --indigo-950: #0d0a1f; --indigo-900: #1a1635; --indigo-800: #26215C;
    --indigo-700: #3C3489; --indigo-600: #534AB7; --indigo-500: #7F77DD;
    --indigo-300: #B6B1F4; --indigo-200: #D6D2FB; --indigo-100: #EEEDFE; --indigo-50: #f8f7fe;
    --gold-700: #BA7517; --gold-500: #EF9F27; --gold-100: #FAEEDA;
    --neutral-900: #1a1a1a; --neutral-500: #666666; --light-text: #AFA9EC;
    --ok-bg: #E4F5EA; --ok-text: #1F7A45;
    --attn-bg: var(--gold-100); --attn-text: var(--gold-700);
    --absent-bg: #FBE7E7; --absent-text: #B33636;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Outfit', system-ui, sans-serif;
    background: var(--indigo-50); color: var(--neutral-900); -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 64px 20px 100px; }
  .trema { display: flex; gap: 6px; margin-bottom: 14px; }
  .trema span { width: 6px; height: 6px; border-radius: 50%; background: var(--gold-700); opacity: .9; }
  .eyebrow { font-size: 13px; font-weight: 500; color: var(--indigo-600); margin: 0 0 8px; }
  h1 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 700; font-size: 44px; line-height: 1.1; margin: 0 0 8px; }
  .meta { color: var(--neutral-500); margin: 0 0 40px; font-size: 15px; }

  .score-row { display: flex; align-items: center; gap: 22px; margin-bottom: 14px; }
  .score-reassurance { font-size: 14px; color: var(--neutral-500); margin: 0 0 28px; line-height: 1.5; }
  .score-circle {
    flex-shrink: 0; width: 84px; height: 84px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .score-circle::before { content: ''; position: absolute; inset: 8px; border-radius: 50%; background: var(--indigo-50); }
  .score-num-wrap { position: relative; z-index: 1; font-family: 'Fraunces', serif; font-style: italic; font-weight: 700; color: var(--indigo-950); font-size: 22px; line-height: 1; }
  .score-num-wrap span { font-size: 13px; font-weight: 400; font-style: normal; color: var(--neutral-500); }
  .score-label { font-size: 13px; font-weight: 500; color: var(--neutral-500); margin: 0 0 6px; text-transform: uppercase; letter-spacing: .03em; }
  .score-compare { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--indigo-700); font-weight: 500; margin: 0; line-height: 1.4; }
  .score-compare svg { flex-shrink: 0; }

  .print-btn {
    position: fixed; top: 24px; right: 24px; z-index: 20;
    background: var(--indigo-600); color: #fff; border: none; border-radius: 10px;
    padding: 10px 18px; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; box-shadow: 0 4px 16px rgba(83,74,183,.28);
  }

  .quote {
    background: var(--indigo-100); border: 1px solid var(--indigo-200); border-radius: 16px;
    padding: 22px 26px; margin-bottom: 44px; font-style: italic; font-size: 16px; line-height: 1.6;
  }
  .quote .signature { display: block; margin-top: 10px; font-style: normal; font-size: 13px; color: var(--neutral-500); }

  h2 { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 21px; margin: 0 0 20px; }
  section { margin-bottom: 48px; }

  .diag-item { display: flex; align-items: flex-start; gap: 16px; background: #fff; border-radius: 14px; padding: 16px 18px; margin-bottom: 10px; box-shadow: 0 4px 24px rgba(83,74,183,0.06); }
  .status-pill { flex-shrink: 0; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .status-ok { background: var(--ok-bg); color: var(--ok-text); }
  .status-attention { background: var(--attn-bg); color: var(--attn-text); }
  .status-absent { background: var(--absent-bg); color: var(--absent-text); }
  .diag-label { font-weight: 500; margin: 0 0 2px; }
  .diag-detail { font-size: 14px; color: var(--neutral-500); margin: 0; line-height: 1.5; }

  .forts-list { list-style: none; margin: 0; padding: 0; }
  .forts-list li { display: flex; align-items: flex-start; gap: 10px; font-size: 15px; margin-bottom: 10px; line-height: 1.5; }
  .forts-list svg { flex-shrink: 0; margin-top: 3px; color: var(--indigo-600); }

  .axe-card { background: #fff; border-radius: 16px; padding: 22px 24px; margin-bottom: 14px; box-shadow: 0 4px 24px rgba(83,74,183,0.06); }
  .axe-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .impact-badge { display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .impact-fort { background: var(--gold-100); color: var(--gold-700); }
  .impact-moyen { background: var(--indigo-100); color: var(--indigo-700); }
  .impact-faible { background: var(--indigo-50); color: var(--neutral-500); }
  .axe-titre { font-weight: 500; font-size: 16px; margin: 0; }
  .axe-detail { font-size: 14px; color: var(--neutral-500); margin: 0; line-height: 1.6; }

  .offre-box { background: var(--indigo-950); color: #fff; border-radius: 20px; padding: 36px 32px; }
  .offre-eyebrow { color: var(--light-text); font-size: 13px; margin: 0 0 10px; }
  .offre-nom { font-family: 'Fraunces', serif; font-style: italic; font-weight: 700; font-size: 30px; margin: 0 0 14px; color: #fff; }
  .offre-argument { color: rgba(255,255,255,.88); font-size: 15px; line-height: 1.6; margin: 0 0 18px; }
  .offre-prix { font-family: 'Fraunces', serif; font-style: italic; font-weight: 700; font-size: 26px; color: var(--indigo-300); margin: 0 0 24px; }
  .cta-btn { display: inline-flex; align-items: center; justify-content: center; background: #fff; color: var(--indigo-600); font-weight: 500; font-size: 15px; padding: 13px 28px; border-radius: 12px; text-decoration: none; font-family: 'Outfit', sans-serif; }

  .footnote { text-align: center; font-size: 12px; color: #9a94c9; margin-top: 40px; }

  .empty-state { max-width: 480px; margin: 120px auto; text-align: center; padding: 0 20px; }
  .empty-state h1 { font-size: 28px; }
  .empty-state p { color: var(--neutral-500); }

  @media print {
    .print-btn { display: none !important; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
async function decodeCompressed(str) {
  const base64 = str.replace(/-/g, '+').replace(/_/g, '/');
  const padded = base64 + '='.repeat((4 - (base64.length % 4)) % 4);
  const binary = atob(padded);
  const bytes = Uint8Array.from(binary, (c) => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const buf = await new Response(stream).arrayBuffer();
  return new TextDecoder('utf-8').decode(buf);
}

function esc(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

function slugify(str) {
  return (str ?? '')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '');
}

const STATUS_LABEL = { ok: 'OK', attention: 'À améliorer', absent: 'Absent' };
const CHECK_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>';
const COMPARE_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 20V10m8 10V4m8 16v-7"/></svg>';

function renderEmptyState() {
  document.getElementById('app').innerHTML = `
    <div class="empty-state">
      <h1>Lien d'audit introuvable</h1>
      <p>Ce lien semble incomplet ou invalide. Contactez Kaïro si vous pensez qu'il s'agit d'une erreur.</p>
    </div>`;
}

function render(data) {
  const scorePct = data.scoreGlobal != null ? Math.round((data.scoreGlobal / 10) * 100) : null;

  const scoreHtml = data.scoreGlobal != null ? `
    <div class="score-row">
      <div class="score-circle" style="background: conic-gradient(var(--indigo-600) ${scorePct}%, var(--indigo-100) 0);">
        <div class="score-num-wrap">${esc(data.scoreGlobal)}<span>/10</span></div>
      </div>
      <div>
        <p class="score-label">Présence digitale actuelle</p>
        ${data.comparaisonConcurrence ? `<p class="score-compare">${COMPARE_ICON} ${esc(data.comparaisonConcurrence)}</p>` : ''}
      </div>
    </div>
    <p class="score-reassurance">Chaque point ci-dessous est actionnable rapidement — ce n'est pas une fatalité.</p>` : '';

  const quoteHtml = data.messagePersonnel ? `
    <div class="quote">
      ${esc(data.messagePersonnel)}
      <span class="signature">— Romain, Kaïro</span>
    </div>` : '';

  const diagHtml = (data.diagnostic || []).map((p) => `
    <div class="diag-item">
      <span class="status-pill status-${esc(p.status)}">${STATUS_LABEL[p.status] || p.status}</span>
      <div>
        <p class="diag-label">${esc(p.label)}</p>
        <p class="diag-detail">${esc(p.detail)}</p>
      </div>
    </div>`).join('');

  const fortsHtml = (data.pointsForts || []).filter(Boolean).map((pt) => `
    <li>${CHECK_ICON}${esc(pt)}</li>`).join('');

  const axesHtml = (data.axes || []).map((a) => `
    <div class="axe-card">
      <div class="axe-head">
        <span class="impact-badge impact-${esc(a.impact)}">Impact ${esc(a.impact)}</span>
        <p class="axe-titre">${esc(a.titre)}</p>
      </div>
      <p class="axe-detail">${esc(a.detail)}</p>
    </div>`).join('');

  const offre = data.offreRecommandee || {};
  const dateStr = data.dateAudit ? new Date(data.dateAudit).toLocaleDateString('fr-FR') : '';
  const trackSlug = `${slugify(data.entreprise)}-${data.dateAudit || ''}`;

  document.getElementById('app').innerHTML = `
    <button class="print-btn" onclick="window.print()">Télécharger en PDF</button>
    <div class="wrap">
      <div class="trema"><span></span><span></span></div>
      <p class="eyebrow">Audit digital personnalisé</p>
      <h1>${esc(data.entreprise)}</h1>
      <p class="meta">${esc(data.secteur)} · ${esc(data.ville)}</p>

      ${scoreHtml}
      ${quoteHtml}

      ${diagHtml ? `<section><h2>État des lieux de votre présence en ligne</h2>${diagHtml}</section>` : ''}
      ${fortsHtml ? `<section><h2>Ce qui fonctionne déjà</h2><ul class="forts-list">${fortsHtml}</ul></section>` : ''}
      ${axesHtml ? `<section><h2>Axes d'amélioration prioritaires</h2>${axesHtml}</section>` : ''}

      <section style="margin-bottom: 0;">
        <div class="offre-box">
          <p class="offre-eyebrow">Ce que Kaïro peut vous apporter</p>
          <p class="offre-nom">${esc(offre.nom)}</p>
          <p class="offre-argument">${esc(offre.argument)}</p>
          <p class="offre-prix">${esc(offre.prix)}</p>
          <a href="https://kairo.fr/#contact" class="cta-btn">En discuter avec Romain</a>
        </div>
      </section>

      <p class="footnote">${dateStr ? `Audit réalisé le ${dateStr} par ` : ''}Kaïro — kairo.fr</p>
    </div>
    <img src="/api/track?e=${encodeURIComponent(trackSlug)}" width="1" height="1" alt="" style="position:absolute;opacity:0;pointer-events:none;">`;
}

(async () => {
  try {
    const params = new URLSearchParams(window.location.search);
    const encoded = params.get('d');
    if (!encoded) throw new Error('missing param');
    const json = await decodeCompressed(encoded);
    const data = JSON.parse(json);
    if (!data.entreprise || !Array.isArray(data.diagnostic)) throw new Error('invalid data');
    render(data);
    document.title = data.entreprise + ' — Audit Kaïro';
  } catch (e) {
    renderEmptyState();
  }
})();
</script>

</body>
</html>
