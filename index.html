<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Audit de présence en ligne — Kaïro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Charte Kaïro v3 « Le Fil » : Forum (titres), Archivo (corps, axe de largeur pour les labels) -->
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Archivo:wdth,wght@82..100,300..700&display=swap" rel="stylesheet">
<style>
  /* Tokens de la charte v3 — 01_Lancement/Marque_Kairo/CHARTE_KAIRO_V3.md fait foi */
  :root {
    --terre: #EFEAE1;          /* fond dominant */
    --encre: #16130F;          /* texte, fond inversé */
    --gris-lu: #645E54;        /* texte secondaire sur terre (5,36) */
    --gris-ui: #7C766C;        /* filets porteurs d'information, jamais du texte */
    --trait: #D8D1C3;          /* séparateurs décoratifs */
    --cinabre: #C0442A;        /* LE FIL : traits et grands chiffres, jamais un aplat */
    --cinabre-lu: #A63A23;     /* cinabre lisible en petit texte (5,39) */
    --lu-inv: #EFEAE1;         /* texte sur encre */
    --gris-lu-inv: #A8A399;    /* secondaire sur encre (7,37) */
    --font-display: "Forum", "Optima", "Palatino Linotype", serif;
    --font-corps: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --kairos: cubic-bezier(0.16, 1, 0.3, 1);
    /* Arête de tesson : les blocs inversés ne sont jamais des rectangles pleins */
    --tesson: polygon(0 0, 100% 0, 100% 95.5%, 88.3% 98.2%, 75.4% 94.4%, 63.3% 97.6%, 50% 94.8%, 37.9% 98.6%, 25.8% 94.6%, 11.7% 97.9%, 0 96.4%);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--font-corps); font-size: 16px; line-height: 1.62;
    background: var(--terre); color: var(--encre); -webkit-font-smoothing: antialiased;
    border-top: 1px solid var(--cinabre); /* le fil, en tête de page */
  }
  /* Colonne de lecture asymétrique : décalée à gauche, jamais centrée */
  .wrap { max-width: 760px; margin: 0 24px; padding: 48px 0 96px; }
  @media (min-width: 900px) { .wrap { margin-left: clamp(40px, 12vw, 200px); padding-top: 64px; } }

  /* Libellés : Archivo 600 condensé, capitales, approche large */
  .label {
    font-size: 11.5px; font-weight: 600; font-stretch: 88%; text-transform: uppercase;
    letter-spacing: .18em; line-height: 1; color: var(--gris-lu); margin: 0;
  }

  .marque { font-family: var(--font-display); font-size: 28px; letter-spacing: .05em; margin: 0 0 48px; }
  .marque i { font-style: normal; color: var(--cinabre); } /* le tréma : un signe, pas un aplat */

  h1 {
    font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 5.2vw, 68px);
    line-height: 1.08; letter-spacing: .005em; margin: 16px 0 12px;
  }
  .meta { color: var(--gris-lu); margin: 0 0 48px; font-size: 13px; font-variant-numeric: tabular-nums; }

  /* Score : un grand chiffre cinabre et une règle graduée de 10 pas */
  .score { margin-bottom: 48px; }
  .score-ligne { display: flex; align-items: baseline; gap: 8px; margin: 16px 0 12px; }
  .score > .label + .score-compare { margin-top: 12px; }
  .score-num { font-family: var(--font-display); font-size: clamp(52px, 7.4vw, 88px); line-height: .9; color: var(--cinabre); font-variant-numeric: tabular-nums; }
  .score-sur { font-size: 16px; color: var(--gris-lu); font-variant-numeric: tabular-nums; }
  .regle {
    position: relative; height: 12px; max-width: 420px; margin-bottom: 16px;
    /* 11 graduations en gris-ui, une tous les 10 % */
    background: repeating-linear-gradient(to right, var(--gris-ui) 0 1px, transparent 1px 10%) bottom / 100.25% 8px no-repeat;
    border-bottom: 1px solid var(--gris-ui);
  }
  .regle span { position: absolute; left: 0; bottom: -1px; height: 1.5px; background: var(--cinabre); }
  .score-compare { margin: 0; max-width: 62ch; }
  .score-reassurance { font-size: 13px; color: var(--gris-lu); margin: 8px 0 0; max-width: 62ch; }

  .print-btn {
    position: absolute; top: 16px; right: 16px; z-index: 20; /* reste en tête : ne couvre jamais le contenu */
    background: var(--terre); color: var(--encre); border: 1.5px solid var(--encre); border-radius: 0;
    min-height: 44px; padding: 0 18px; font-family: var(--font-corps); font-size: 13px; font-weight: 700;
    font-stretch: 88%; text-transform: uppercase; letter-spacing: .16em; cursor: pointer;
    transition: background-color 200ms var(--kairos), color 200ms var(--kairos);
  }
  .print-btn:hover { background: var(--encre); color: var(--terre); }

  /* Le mot de Romain : un chapô porté par le fil */
  .quote {
    margin: 0 0 64px; padding-left: 20px; border-left: 1.5px solid var(--cinabre);
    font-size: clamp(20px, 1.9vw, 24px); font-weight: 350; line-height: 1.42; max-width: 34em;
  }
  .quote .signature { display: block; margin-top: 12px; font-size: 13px; font-weight: 400; color: var(--gris-lu); }

  section { margin-bottom: 64px; }
  /* Intertitre : Forum capitales, 26 px minimum, cinq mots maximum */
  h2 {
    font-family: var(--font-display); font-weight: 400; font-size: 26px; text-transform: uppercase;
    letter-spacing: .05em; line-height: 1.2; margin: 0 0 24px;
  }

  /* Lignes du diagnostic et des axes : pas de carte, un séparateur entre chaque */
  .ligne { padding: 16px 0; border-top: 1px solid var(--trait); }
  .ligne:first-of-type { border-top: none; padding-top: 0; }
  .ligne-tete { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 4px; }
  .ligne-titre { font-weight: 600; margin: 0; }
  .ligne-detail { margin: 0; color: var(--gris-lu); max-width: 62ch; }

  /* Statut : un MOT précédé d'un trait — lisible aussi en noir et blanc */
  .statut { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; white-space: nowrap; }
  .statut::before { content: ''; width: 12px; height: 1px; background: var(--gris-ui); }
  .statut-attention, .statut-absent, .impact-fort { color: var(--cinabre-lu); }
  .statut-attention::before, .statut-absent::before, .impact-fort::before { background: var(--cinabre); height: 1.5px; }

  /* Ce qui fonctionne : chaque ligne précédée d'un trait de 12 px, ni puce ni coche */
  .forts { list-style: none; margin: 0; padding: 0; max-width: 62ch; }
  .forts li { position: relative; padding-left: 28px; margin-bottom: 12px; }
  .forts li::before { content: ''; position: absolute; left: 0; top: .8em; width: 12px; height: 1px; background: var(--encre); }

  .axe-num { font-family: var(--font-display); font-size: 26px; line-height: 1; color: var(--cinabre); margin-right: 12px; font-variant-numeric: tabular-nums; }
  .axe-titre { display: flex; align-items: baseline; }

  /* L'offre : chapitre inversé, coupé au tesson */
  .offre { background: var(--encre); color: var(--lu-inv); padding: 48px 32px 72px; clip-path: var(--tesson); }
  .offre .label { color: var(--gris-lu-inv); }
  .offre-nom {
    font-family: var(--font-display); font-size: clamp(27px, 3.4vw, 42px); text-transform: uppercase;
    letter-spacing: .02em; line-height: 1.15; margin: 16px 0 16px;
  }
  .offre-argument { margin: 0 0 16px; max-width: 62ch; }
  .offre-prix { font-size: clamp(27px, 3.4vw, 42px); font-weight: 300; font-variant-numeric: tabular-nums; margin: 0 0 32px; }
  /* Bouton contour inversé : bordure terre, plein terre au survol */
  .cta-btn {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 26px;
    border: 1.5px solid var(--lu-inv); color: var(--lu-inv); text-decoration: none;
    font-size: 13px; font-weight: 700; font-stretch: 88%; text-transform: uppercase; letter-spacing: .16em;
    transition: background-color 200ms var(--kairos), color 200ms var(--kairos);
  }
  .cta-btn:hover { background: var(--lu-inv); color: var(--encre); }

  .footnote { font-size: 13px; color: var(--gris-lu); margin-top: 32px; font-variant-numeric: tabular-nums; }
  .footnote a { color: inherit; text-decoration: underline; text-decoration-color: var(--cinabre); text-underline-offset: 3px; }

  .empty-state { max-width: 560px; margin: 0 24px; padding: 120px 0; }
  @media (min-width: 900px) { .empty-state { margin-left: clamp(40px, 12vw, 200px); } }
  .empty-state h1 { font-size: clamp(34px, 5.2vw, 52px); }
  .empty-state p { color: var(--gris-lu); max-width: 62ch; }

  /* Focus visible : anneau cinabre décollé */
  :focus-visible { outline: 1px solid var(--cinabre); outline-offset: 6px; }

  @media (max-width: 600px) {
    .ligne-tete { flex-direction: column; gap: 6px; }
    .offre { padding: 40px 24px 64px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  @media print {
    .print-btn { display: none !important; }
    body { background: #fff; border-top: none; }
    .wrap { margin: 0; padding: 0; max-width: none; }
    /* L'offre repasse en encre sur papier : un fond encre vide les cartouches */
    .offre { background: none; color: var(--encre); clip-path: none; padding: 0 0 0 20px; border-left: 1.5px solid var(--cinabre); }
    .offre .label { color: var(--gris-lu); }
    .cta-btn { border-color: var(--encre); color: var(--encre); }
    .ligne, section, .offre { break-inside: avoid; }
    h2 { break-after: avoid; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { size: A4; margin: 18mm 16mm; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
async function decodeCompressed(str) {
  const base64 = str.replace(/-/g, '+').replace(/_/g, '/');
  const padded = base64 + '='.repeat((4 - (base64.length % 4)) % 4);
  const binary = atob(padded);
  const bytes = Uint8Array.from(binary, (c) => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const buf = await new Response(stream).arrayBuffer();
  return new TextDecoder('utf-8').decode(buf);
}

function esc(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

function slugify(str) {
  return (str ?? '')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '');
}

const STATUS_LABEL = { ok: 'En place', attention: 'À améliorer', absent: 'Absent' };
// Site Kaïro : www.kaïro.fr, formulaire de contact sur l'ancre #rdv
const SITE = 'https://www.xn--karo-6pa.fr';

function renderEmptyState() {
  document.getElementById('app').innerHTML = `
    <div class="empty-state">
      <p class="marque">Ka<i>ï</i>ro</p>
      <h1>Lien d'audit introuvable</h1>
      <p>Ce lien semble incomplet ou invalide. Écrivez-moi si vous pensez qu'il s'agit d'une erreur : <a href="mailto:contact@xn--karo-6pa.fr">contact@kaïro.fr</a>.</p>
    </div>`;
}

function render(data) {
  // Position du fil cinabre sur la règle graduée (0 à 100 %)
  const scorePct = data.scoreGlobal != null ? Math.max(0, Math.min(100, (data.scoreGlobal / 10) * 100)) : null;

  // La comparaison concurrence s'affiche même sans note (la note peut rester vide)
  const scoreHtml = (data.scoreGlobal != null || data.comparaisonConcurrence) ? `
    <div class="score">
      <p class="label">Présence en ligne actuelle</p>
      ${data.scoreGlobal != null ? `
      <p class="score-ligne"><span class="score-num">${esc(data.scoreGlobal)}</span><span class="score-sur">/10</span></p>
      <div class="regle" aria-hidden="true"><span style="width:${scorePct}%"></span></div>` : ''}
      ${data.comparaisonConcurrence ? `<p class="score-compare">${esc(data.comparaisonConcurrence)}</p>` : ''}
      ${data.scoreGlobal != null ? `<p class="score-reassurance">Chaque point ci-dessous se corrige rapidement — ce n'est pas une fatalité.</p>` : ''}
    </div>` : '';

  const quoteHtml = data.messagePersonnel ? `
    <blockquote class="quote">
      ${esc(data.messagePersonnel)}
      <span class="signature">— Romain, Kaïro</span>
    </blockquote>` : '';

  const diagHtml = (data.diagnostic || []).map((p) => `
    <div class="ligne">
      <div class="ligne-tete">
        <p class="ligne-titre">${esc(p.label)}</p>
        <span class="label statut statut-${esc(p.status)}">${esc(STATUS_LABEL[p.status] || p.status)}</span>
      </div>
      <p class="ligne-detail">${esc(p.detail)}</p>
    </div>`).join('');

  const fortsHtml = (data.pointsForts || []).filter(Boolean).map((pt) => `
    <li>${esc(pt)}</li>`).join('');

  const axesHtml = (data.axes || []).map((a, i) => `
    <div class="ligne">
      <div class="ligne-tete">
        <p class="ligne-titre axe-titre"><span class="axe-num">${i + 1}</span>${esc(a.titre)}</p>
        <span class="label statut impact-${esc(a.impact)}">Impact ${esc(a.impact)}</span>
      </div>
      <p class="ligne-detail">${esc(a.detail)}</p>
    </div>`).join('');

  const offre = data.offreRecommandee || {};
  const dateStr = data.dateAudit ? new Date(data.dateAudit).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
  const trackSlug = `${slugify(data.entreprise)}-${data.dateAudit || ''}`;
  const meta = [data.secteur, data.ville].filter(Boolean).map(esc).join(' · ');

  document.getElementById('app').innerHTML = `
    <button class="print-btn" onclick="window.print()">Télécharger en PDF</button>
    <main class="wrap">
      <p class="marque">Ka<i>ï</i>ro</p>
      <p class="label">Audit de présence en ligne</p>
      <h1>${esc(data.entreprise)}</h1>
      <p class="meta">${meta}${dateStr ? `${meta ? ' · ' : ''}${dateStr}` : ''}</p>

      ${scoreHtml}
      ${quoteHtml}

      ${diagHtml ? `<section><h2>État des lieux</h2>${diagHtml}</section>` : ''}
      ${fortsHtml ? `<section><h2>Ce qui fonctionne déjà</h2><ul class="forts">${fortsHtml}</ul></section>` : ''}
      ${axesHtml ? `<section><h2>Par où commencer</h2>${axesHtml}</section>` : ''}

      ${offre.nom ? `
      <section class="offre" style="margin-bottom: 0;">
        <p class="label">Ce que Kaïro peut vous apporter</p>
        <p class="offre-nom">${esc(offre.nom)}</p>
        ${offre.argument ? `<p class="offre-argument">${esc(offre.argument)}</p>` : ''}
        ${offre.prix ? `<p class="offre-prix">${esc(offre.prix)}</p>` : ''}
        <a href="${SITE}/#rdv" class="cta-btn">En parler avec Romain</a>
      </section>` : ''}

      <p class="footnote">${dateStr ? `Audit réalisé le ${dateStr} par ` : ''}Kaïro — <a href="${SITE}">kaïro.fr</a></p>
    </main>
    <img src="/api/track?e=${encodeURIComponent(trackSlug)}" width="1" height="1" alt="" style="position:absolute;opacity:0;pointer-events:none;">`;
}

(async () => {
  try {
    const params = new URLSearchParams(window.location.search);
    const encoded = params.get('d');
    if (!encoded) throw new Error('missing param');
    const json = await decodeCompressed(encoded);
    const data = JSON.parse(json);
    if (!data.entreprise || !Array.isArray(data.diagnostic)) throw new Error('invalid data');
    render(data);
    document.title = data.entreprise + ' — Audit Kaïro';
  } catch (e) {
    renderEmptyState();
  }
})();
</script>

</body>
</html>
